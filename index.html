                                                    const scanned = orders.filter(o => state.retours.scannedOrders.has(o.tracking)).length;
                                                    const remaining = orders.length - scanned;
                                                    const percent = Math.round((scanned / orders.length) * 100);
                                                    return `
                                                        <div class="bg-white rounded-lg p-3 border border-orange-200">
                                                            <div class="flex justify-between items-center mb-2">
                                                                <div class="flex items-center gap-2">
                                                                    <span class="bg-orange-500 text-white w-10 h-10 rounded-full flex items-center justify-center font-black">
                                                                        ${orders.length}
                                                                    </span>
                                                                    <span class="font-bold text-orange-900 text-lg">${store}</span>
                                                                </div>
                                                                <div class="text-right">
                                                                    <span class="text-green-600 font-bold">✓ ${scanned}</span>
                                                                    <span class="text-gray-400 mx-1">|</span>
                                                                    <span class="text-red-600 font-bold">✗ ${remaining}</span>
                                                                </div>
                                                            </div>
                                                            <div class="bg-gray-200 rounded-full h-3">
                                                                <div class="bg-gradient-to-r from-orange-400 to-orange-600 h-full rounded-full transition-all" style="width: ${percent}%"></div>
                                                            </div>
                                                            <p class="text-xs text-gray-500 mt-1 text-right">${percent}% scanné</p>
                                                        </div>
                                                    `;
                                                }).join('')}
                                        </div>
                                        
                                        <!-- Total général -->
                                        <div class="mt-4 pt-4 border-t-2 border-orange-300">
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-orange-900 text-lg">📦 Total Général</span>
                                                <div class="flex gap-4">
                                                    <span class="bg-green-500 text-white px-3 py-1 rounded-full font-bold">
                                                        ✓ ${state.retours.scannedOrders.size} scannés
                                                    </span>
                                                    <span class="bg-red-500 text-white px-3 py-1 rounded-full font-bold">
                                                        ✗ ${state.retours.orders.length - state.retours.scannedOrders.size} restants
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            ` : ''}
                        </div>
                    ` : ''}

                    ${state.retours.currentView === 'scan' && totalOrders > 0 ? `
                        <!-- Scan Retours -->
                        <div class="bg-white rounded-3xl shadow-2xl p-6 mb-4 fade-in">
                            <h2 class="text-2xl font-black text-gray-800 mb-4 text-center">
                                📸 SCANNER RETOURS
                            </h2>

                            <!-- Bouton ajouter PDF -->
                            <div class="mb-4 text-center">
                                <button onclick="document.getElementById('retourFileInputAdd').click()" 
                                        class="px-4 py-2 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 transition-all">
                                    ➕ Ajouter PDF
                                </button>
                                <input type="file" id="retourFileInputAdd" multiple accept=".pdf" class="hidden" 
                                       onchange="handleRetourFiles(this.files)">
                            </div>

                            <!-- Stats rapides par store -->
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
                                ${Object.entries(state.retours.storeGroups)
                                    .sort((a, b) => b[1].length - a[1].length)
                                    .map(([store, orders]) => {
                                        const scanned = orders.filter(o => state.retours.scannedOrders.has(o.tracking)).length;
                                        const remaining = orders.length - scanned;
                                        return `
                                            <div class="bg-gradient-to-br from-orange-100 to-orange-200 rounded-lg p-2 text-center border border-orange-300">
                                                <p class="text-lg font-black text-orange-700">${remaining}/${orders.length}</p>
                                                <p class="text-xs font-bold text-gray-600">${store}</p>
                                            </div>
                                        `;
                                    }).join('')}
                            </div>

                            <!-- Input manuel -->
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-gray-700 mb-2">Saisie manuelle ou scan douchette :</label>
                                <div class="flex gap-2">
                                    <input type="text" 
                                           id="retourScanInput"
                                           class="flex-1 px-4 py-4 border-2 border-orange-300 rounded-xl text-lg font-mono focus:border-orange-500 focus:ring-2 focus:ring-orange-200 outline-none"
                                           placeholder="Scanner ou saisir le tracking..."
                                           onkeypress="if(event.key === 'Enter') { handleRetourScan(this.value); this.value = ''; }"
                                           autofocus>
                                    <button onclick="handleRetourScan(document.getElementById('retourScanInput').value); document.getElementById('retourScanInput').value = '';" 
                                            class="px-6 py-4 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700 transition-all">
                                        ✓
                                    </button>
                                </div>
                            </div>

                            ${state.retours.lastScanned ? `
                                <div class="bg-green-100 border-2 border-green-500 rounded-xl p-4 text-center mb-4">
                                    <p class="text-green-800 font-bold text-lg">
                                        Dernier: <span class="font-mono">${state.retours.lastScanned}</span>
                                    </p>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Liste des retours restants par STORE -->
                        ${remainingOrders.length > 0 ? `
                            <div class="bg-white rounded-3xl shadow-2xl p-6 fade-in">
                                <h2 class="text-xl font-black text-gray-800 mb-4">
                                    ⏳ Retours restants (${remainingOrders.length})
                                </h2>
                                
                                <!-- Grouper par store -->
                                ${Object.entries(state.retours.storeGroups)
                                    .filter(([store, orders]) => orders.some(o => !state.retours.scannedOrders.has(o.tracking)))
                                    .sort((a, b) => b[1].length - a[1].length)
                                    .map(([store, orders]) => {
                                        const remaining = orders.filter(o => !state.retours.scannedOrders.has(o.tracking));
                                        if (remaining.length === 0) return '';
                                        return `
                                            <div class="mb-4">
                                                <div class="flex items-center gap-2 mb-2 bg-orange-100 rounded-lg p-2">
                                                    <span class="bg-orange-500 text-white px-3 py-1 rounded-full font-black">${remaining.length}</span>
                                                    <span class="font-bold text-orange-800">${store}</span>
                                                </div>
                                                <div class="max-h-60 overflow-auto space-y-1 pl-2">
                                                    ${remaining.slice(0, 20).map(order => `
                                                        <div class="bg-orange-50 border border-orange-200 rounded-lg p-2 flex items-center justify-between">
                                                            <div>
                                                                <p class="font-mono font-bold text-orange-900 text-sm">${order.tracking}</p>
                                                                <p class="text-xs text-gray-500">${order.order} | ${order.ville}</p>
                                                            </div>
                                                            <button onclick="handleRetourScan('${order.tracking}')" 
                                                                    class="px-2 py-1 bg-orange-600 text-white rounded text-xs font-bold hover:bg-orange-700">
                                                                ✓
                                                            </button>
                                                        </div>
                                                    `).join('')}
                                                    ${remaining.length > 20 ? `
                                                        <p class="text-center text-gray-500 py-1 text-sm">... et ${remaining.length - 20} autres</p>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                            </div>
                        ` : `
                            <div class="bg-gradient-to-br from-green-400 to-green-500 rounded-3xl shadow-2xl p-12 text-center text-white fade-in">
                                <div class="text-8xl mb-4">🎉</div>
                                <h2 class="text-4xl font-black mb-2">TERMINÉ !</h2>
                                <p class="text-xl font-bold">Tous les retours sont scannés</p>
                            </div>
                        `}

                        <!-- Codes inconnus -->
                        ${state.retours.unknownCodes.length > 0 ? `
                            <div class="bg-white rounded-3xl shadow-2xl p-6 mt-4 border-4 border-red-500 fade-in">
                                <h2 class="text-xl font-black text-red-800 mb-4">
                                    ❌ Codes Non Trouvés (${state.retours.unknownCodes.length})
                                </h2>
                                <div class="space-y-2">
                                    ${state.retours.unknownCodes.map(item => `
                                        <div class="bg-red-50 border border-red-200 rounded-lg p-3">
                                            <p class="font-mono font-bold text-red-900">${item.code}</p>
                                            <p class="text-xs text-red-600">${item.date} ${item.time}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    ` : ''}
                </div>
            `;

            // Focus sur l'input
            if (state.retours.currentView === 'scan') {
                setTimeout(() => {
                    const input = document.getElementById('retourScanInput');
                    if (input) input.focus();
                }, 100);
            }
        }

        // Exporter CSV retours
        function exportRetoursCSV() {
            const headers = ['Order', 'Tracking', 'Ville', 'Store', 'Statut'];
            const rows = state.retours.orders.map(order => [
                order.order,
                order.tracking,
                order.ville,
                order.store,
                state.retours.scannedOrders.has(order.tracking) ? 'Scanné' : 'Non scanné'
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `retours_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Event handlers globaux
        function changeView(view) {
            if (view !== state.currentView) {
                // Sauvegarder l'état de la caméra
                const wasCameraActive = state.scanMode === 'camera' && state.isCameraActive;
                
                // Arrêter la caméra si on change de vue
                if (wasCameraActive) {
                    stopCamera();
                }
            }
            state.currentView = view;
            render();
        }

        function handleFileInput(event) {
            handleFiles(event.target.files);
        }

        // Initialisation
        window.addEventListener('load', async () => {
            // Initialiser IndexedDB
            try {
                await initIndexedDB();
            } catch (error) {
                console.error('❌ Erreur init IndexedDB:', error);
            }
            
            // 📥 Restaurer les données sauvegardées localement
            const hasData = loadFromLocalStorage();
            if (hasData) {
                console.log('✅ Données restaurées depuis le stockage local');
                
                // Charger les images PDF depuis IndexedDB
                try {
                    const pdfPages = await loadAllPDFPagesFromDB();
                    state.pdfPages = pdfPages;
                    console.log(`📸 ${Object.keys(pdfPages).length} images PDF chargées depuis IndexedDB`);
                } catch (error) {
                    console.error('❌ Erreur chargement images PDF:', error);
                }
                
                // Si des données ont été chargées, afficher la vue scan
                if (state.referenceOrders.length > 0) {
                    state.currentView = 'scan';
                    showNotification('✅ Données restaurées', 'success');
                }
            }
            
            // 📥 Charger les retours
            loadRetoursFromLocalStorage();
            
            initBarcodeScanner(); // Initialiser le listener du scanner
            render();
        });

        // Nettoyage à la fermeture
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
</html>
