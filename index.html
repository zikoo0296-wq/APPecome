<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGYLOG Scanner Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.95) translateY(-20px); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes scanLine {
            0%, 100% { top: 0; }
            50% { top: 100%; }
        }
        .scan-line {
            animation: scanLine 2s ease-in-out infinite;
        }
        video {
            object-fit: cover;
        }
        .viewfinder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 400px;
            aspect-ratio: 3/2;
            border: 3px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #22c55e;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-blue-900 min-h-screen">
    <div id="app"></div>

    <script>
        // Configuration PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // État de l'application
        let state = {
            referenceOrders: [],
            scannedOrders: new Set(),
            unknownCodes: [], // Codes non trouvés
            uploadedFiles: [],
            currentView: 'import',
            activeTab: 'expedition', // 'expedition' ou 'retours'
            scanMode: 'keyboard',
            scanInput: '',
            lastScanned: '',
            isProcessing: false,
            dragActive: false,
            isCameraActive: false,
            isStartingCamera: false,
            cameraStream: null,
            codeReader: null,
            scanBuffer: '',
            lastKeyTime: 0,
            continuousScan: true,
            douchetteMode: true,
            storeGroups: {},
            scanQueue: [],
            pdfPages: {}, // 📸 Stockage des images des pages PDF
            selectMode: false, // Mode sélection activé
            selectedCodes: new Set(), // Codes sélectionnés
            // ============= RETOURS =============
            retours: {
                orders: [], // Liste des commandes retour importées
                scannedOrders: new Set(), // Codes scannés
                storeGroups: {}, // Groupés par store
                uploadedFiles: [],
                currentView: 'import', // 'import' ou 'scan'
                scanMode: 'keyboard',
                lastScanned: '',
                unknownCodes: []
            }
        };

        // ============= SAUVEGARDE LOCALE (localStorage + IndexedDB) =============
        const STORAGE_KEY = 'digylog_scanner_data';
        const DB_NAME = 'digylog_pdf_images';
        const DB_VERSION = 1;
        const STORE_NAME = 'pdfPages';
        let db = null;

        // Initialiser IndexedDB pour stocker les images PDF
        async function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => {
                    console.error('❌ Erreur ouverture IndexedDB');
                    reject(request.error);
                };
                
                request.onsuccess = () => {
                    db = request.result;
                    console.log('✅ IndexedDB initialisée');
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'code' });
                        console.log('✅ Store IndexedDB créé');
                    }
                };
            });
        }

        // Sauvegarder une image PDF dans IndexedDB
        async function savePDFPageToDB(code, pageData) {
            if (!db) await initIndexedDB();
            
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ code, ...pageData });
                
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Récupérer une image PDF depuis IndexedDB
        async function getPDFPageFromDB(code) {
            if (!db) await initIndexedDB();
            
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(code);
                
                request.onsuccess = () => {
                    if (request.result) {
                        resolve({
                            image: request.result.image,
                            pageNumber: request.result.pageNumber,
                            totalPages: request.result.totalPages
                        });
                    } else {
                        resolve(null);
                    }
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Charger toutes les images PDF dans state.pdfPages
        async function loadAllPDFPagesFromDB() {
            if (!db) await initIndexedDB();
            
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.openCursor();
                const pages = {};
                
                request.onsuccess = (event) => {
                    const cursor = event.target.result;
                    if (cursor) {
                        pages[cursor.value.code] = {
                            image: cursor.value.image,
                            pageNumber: cursor.value.pageNumber,
                            totalPages: cursor.value.totalPages
                        };
                        cursor.continue();
                    } else {
                        console.log(`✅ ${Object.keys(pages).length} images PDF chargées depuis IndexedDB`);
                        resolve(pages);
                    }
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Effacer toutes les images PDF d'IndexedDB
        async function clearPDFPagesFromDB() {
            if (!db) await initIndexedDB();
            
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.clear();
                
                request.onsuccess = () => {
                    console.log('✅ Images PDF effacées d\'IndexedDB');
                    resolve();
                };
                request.onerror = () => reject(request.error);
            });
        }

        // Sauvegarder l'état dans localStorage
        function saveToLocalStorage() {
            try {
                const dataToSave = {
                    referenceOrders: state.referenceOrders,
                    scannedOrders: Array.from(state.scannedOrders), // Convertir Set en Array
                    unknownCodes: state.unknownCodes,
                    uploadedFiles: state.uploadedFiles,
                    storeGroups: state.storeGroups,
                    ordersMap: state.ordersMap || {}, // Ajouter ordersMap
                    lastUpdate: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
                console.log('✅ Données sauvegardées localement');
            } catch (error) {
                console.error('❌ Erreur sauvegarde localStorage:', error);
            }
        }

        // Restaurer l'état depuis localStorage
        function loadFromLocalStorage() {
            try {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    const data = JSON.parse(savedData);
                    state.referenceOrders = data.referenceOrders || [];
                    state.scannedOrders = new Set(data.scannedOrders || []); // Reconvertir en Set
                    state.unknownCodes = data.unknownCodes || [];
                    state.uploadedFiles = data.uploadedFiles || [];
                    state.storeGroups = data.storeGroups || {};
                    state.ordersMap = data.ordersMap || {}; // Restaurer ordersMap
                    
                    console.log('✅ Données restaurées depuis localStorage');
                    console.log(`📦 ${state.referenceOrders.length} commandes importées`);
                    console.log(`✓ ${state.scannedOrders.size} commandes scannées`);
                    return true;
                }
                return false;
            } catch (error) {
                console.error('❌ Erreur restauration localStorage:', error);
                return false;
            }
        }

        // Effacer toutes les données localStorage + IndexedDB
        async function clearLocalStorage() {
            if (confirm('⚠️ Effacer TOUTES les données sauvegardées localement ?\n\nCeci inclut :\n- Commandes importées\n- Scans effectués\n- Codes inconnus\n- Images PDF\n\nCette action est irréversible !')) {
                localStorage.removeItem(STORAGE_KEY);
                
                // Effacer IndexedDB
                try {
                    await clearPDFPagesFromDB();
                } catch (error) {
                    console.error('Erreur effacement IndexedDB:', error);
                }
                
                state.referenceOrders = [];
                state.scannedOrders = new Set();
                state.unknownCodes = [];
                state.uploadedFiles = [];
                state.storeGroups = {};
                state.ordersMap = {};
                state.pdfPages = {};
                state.currentView = 'import';
                showNotification('🗑️ Données effacées', 'success');
                render();
            }
        }

        // Fonction pour afficher une notification avec disparition automatique
        function showNotification(message, type) {
            // Supprimer l'ancienne notification si elle existe
            const oldNotif = document.querySelector('.scan-notification');
            if (oldNotif) {
                oldNotif.remove();
            }

            const notifDiv = document.createElement('div');
            notifDiv.className = `scan-notification fixed top-4 right-4 z-50 px-6 py-4 rounded-lg shadow-2xl text-white font-bold text-lg ${
                type === 'success' ? 'bg-green-500' :
                type === 'warning' ? 'bg-orange-500' :
                'bg-red-500'
            }`;
            notifDiv.style.animation = 'fadeIn 0.3s ease-out';
            notifDiv.textContent = message;
            document.body.appendChild(notifDiv);
            
            // Disparition automatique après 1.5 secondes
            setTimeout(() => {
                notifDiv.style.animation = 'fadeOut 0.3s ease-out';
                setTimeout(() => {
                    if (notifDiv.parentNode) {
                        notifDiv.remove();
                    }
                }, 300);
            }, 1500);
        }

        // Fonction pour jouer un son amélioré avec différents types
        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                if (type === 'success') {
                    // Son de succès : tonalité montante claire (bip caisse)
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.15);
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } else if (type === 'duplicate') {
                    // Son doublon : double bip (bip-bip)
                    oscillator.frequency.value = 600;
                    oscillator.type = 'square';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0, audioContext.currentTime + 0.08);
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime + 0.12);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.25);
                } else if (type === 'error') {
                    // Son erreur : tonalité descendante grave (boup)
                    oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                }
            } catch (error) {
                console.log('Audio not available');
            }
        }

        // Fonction playBeep mise à jour pour utiliser le nouveau système
        function playBeep(frequency = 800, duration = 0.1) {
            if (frequency === 800) playSound('success');
            else if (frequency === 600) playSound('duplicate');
            else playSound('error');
        }

        // Extraire le texte d'un PDF
        async function extractTextFromPDF(arrayBuffer) {
            console.log('📄 === EXTRACTION PDF ===');
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            console.log(`📄 PDF: ${pdf.numPages} pages`);
            let fullText = '';

            // Initialiser le stockage des images si nécessaire
            if (!state.pdfPages) state.pdfPages = {};

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                // Reconstruire le texte avec les positions pour détecter les lignes
                let lastY = null;
                let pageText = '';
                
                for (const item of textContent.items) {
                    // Si la position Y change significativement, c'est une nouvelle ligne
                    if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                        pageText += '\n';
                    } else if (pageText.length > 0 && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
                        pageText += ' ';
                    }
                    pageText += item.str;
                    lastY = item.transform[5];
                }
                
                fullText += pageText + '\n\n';
                console.log(`  📄 Page ${i}: ${pageText.split('\n').length} lignes`);
                
                // 📸 Capturer l'image de la page
                const viewport = page.getViewport({ scale: 2.0 }); // Scale 2x pour bonne qualité
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                // Convertir en base64 JPEG (compression pour économiser mémoire)
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                // Extraire les codes de cette page spécifique
                const pageCodes = extractTrackingCodes(pageText);
                console.log(`  📄 Page ${i}: ${pageCodes.length} codes → stockage image`);
                
                // Associer l'image de la page à chaque code trouvé sur cette page
                for (const code of pageCodes) {
                    const pageData = {
                        image: imageData,
                        pageNumber: i,
                        totalPages: pdf.numPages
                    };
                    
                    // Stocker en mémoire
                    state.pdfPages[code] = pageData;
                    
                    // 💾 Stocker dans IndexedDB pour persistance
                    try {
                        await savePDFPageToDB(code, pageData);
                    } catch (error) {
                        console.warn(`⚠️ Erreur sauvegarde image pour ${code}:`, error);
                    }
                }
            }

            console.log(`✅ Texte extrait: ${fullText.length} caractères`);
            console.log(`📸 Images capturées et sauvegardées: ${Object.keys(state.pdfPages).length} codes`);
            console.log('📝 APERÇU (500 premiers caractères):');
            console.log(fullText.substring(0, 500));
            console.log('---');

            return fullText;
        }

        // Détecter l'expéditeur depuis le haut du document PDF - VERSION AMÉLIORÉE
        function detectExpeditorFromTop(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            console.log('🔍 Recherche expéditeur dans les 30 premières lignes:');
            
            // Chercher dans les 30 premières lignes
            for (let i = 0; i < Math.min(lines.length, 30); i++) {
                const line = lines[i];
                console.log(`Ligne ${i}: "${line}"`);
                
                // Pattern 1: "Expéditeur: XXX" ou "Expéditeur : XXX"
                if (line.toLowerCase().includes('expéditeur') || line.toLowerCase().includes('expediteur')) {
                    // Essayer d'extraire après le ":"
                    const afterColon = line.split(':')[1];
                    if (afterColon) {
                        let expeditor = afterColon.trim()
                            .replace(/\[\d+\]/g, '')  // Enlever [chiffres]
                            .replace(/[-–]/g, '')      // Enlever tirets
                            .replace(/\s+/g, ' ')      // Normaliser espaces
                            .trim();
                        
                        if (expeditor && expeditor.length > 2 && expeditor.length < 50) {
                            console.log(`✅ TROUVÉ (après ":"): "${expeditor}"`);
                            return expeditor;
                        }
                    }
                    
                    // Sinon, chercher sur la ligne suivante
                    const nextLine = lines[i + 1];
                    if (nextLine) {
                        let expeditor = nextLine
                            .replace(/\[\d+\]/g, '')
                            .replace(/[-–]/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                        
                        if (expeditor && expeditor.length > 2 && expeditor.length < 50 && /^[A-Za-z]/.test(expeditor)) {
                            console.log(`✅ TROUVÉ (ligne suivante): "${expeditor}"`);
                            return expeditor;
                        }
                    }
                }
                
                // Pattern 2: Ligne commençant par [chiffres] ou contenant [chiffres]-nom
                const match = line.match(/\[?\d+\]?\s*[-–]?\s*([A-Za-z][A-Za-z0-9\s]+)/);
                if (match && !line.toLowerCase().includes('tel') && !line.toLowerCase().includes('code')) {
                    let expeditor = match[1].trim().split(/\s{2,}/)[0]; // Prendre jusqu'au double espace
                    if (expeditor.length > 2 && expeditor.length < 50) {
                        console.log(`✅ TROUVÉ (pattern code): "${expeditor}"`);
                        return expeditor;
                    }
                }
                
                // Pattern 3: "De: XXX" ou "From: XXX"
                if (line.toLowerCase().startsWith('de:') || line.toLowerCase().startsWith('from:')) {
                    let expeditor = line.split(':')[1].trim()
                        .replace(/\[\d+\]/g, '')
                        .replace(/[-–]/g, '')
                        .trim();
                    
                    if (expeditor && expeditor.length > 2) {
                        console.log(`✅ TROUVÉ (De:/From:): "${expeditor}"`);
                        return expeditor;
                    }
                }
            }
            
            console.log('❌ AUCUN expéditeur trouvé dans les 30 premières lignes');
            console.log('💡 Affichage des 10 premières lignes pour debug:');
            lines.slice(0, 10).forEach((line, i) => console.log(`  ${i}: ${line}`));
            
            return "";
        }

        // Extraire les informations structurées d'un ticket
        function extractTicketInfo(text) {
            const info = {
                store_name: "",
                store_full: "",
                quantity: "",
                product_name: "",
                price: "",
                destination_city: "",
                receiver_name: "",
                order_date: "" // 📅 Date de la commande
            };

            const lines = text.split('\n').map(line => line.trim());

            // 📅 Extraire la date (format: 20/12/25, 19/12/2025, 20-12-25, etc.)
            for (let line of lines) {
                // Pattern 1: DD/MM/YY ou DD/MM/YYYY
                const dateMatch1 = line.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
                if (dateMatch1) {
                    const day = dateMatch1[1].padStart(2, '0');
                    const month = dateMatch1[2].padStart(2, '0');
                    let year = dateMatch1[3];
                    if (year.length === 2) {
                        year = '20' + year;
                    }
                    info.order_date = `${day}/${month}/${year}`;
                    break;
                }
            }

            // Extraire le store_name (après "Expéditeur :")
            for (let line of lines) {
                const expediteurMatch = line.match(/Expéditeur\s*:\s*(.+?)(?:\s*\[|$)/i);
                if (expediteurMatch) {
                    const fullStore = expediteurMatch[1].trim();
                    info.store_full = fullStore;
                    
                    // Nettoyer: enlever [code] et tirets
                    const cleanMatch = fullStore.match(/(?:\[\d+\]\s*[-–]?\s*)?(.+?)(?:\s*\[|$)/);
                    if (cleanMatch) {
                        info.store_name = cleanMatch[1].trim().replace(/^[-–]\s*/, '').replace(/\[\d+\]$/, '');
                    } else {
                        info.store_name = fullStore.replace(/\[\d+\]/g, '').replace(/[-–]/g, '').trim();
                    }
                    break;
                }
            }

            // Extraire quantity et product_name
            for (let line of lines) {
                const quantityMatch = line.match(/(\d+)\s*x\s*(.+?)(?:\s+\d+\s*DH|$)/i);
                if (quantityMatch) {
                    info.quantity = quantityMatch[1];
                    info.product_name = quantityMatch[2].trim();
                    break;
                }
            }

            // Extraire le price
            for (let line of lines) {
                const priceMatch = line.match(/(\d+(?:[.,]\d{2})?)\s*DH/i);
                if (priceMatch) {
                    info.price = priceMatch[1] + ' DH';
                    break;
                }
            }

            // Extraire destination_city - VERSION AMÉLIORÉE
            // Chercher d'abord dans les patterns spécifiques du ticket DIGYLOG
            const moroccanCities = [
                'Casablanca', 'Casa', 'Rabat', 'Marrakech', 'Fes', 'Fès', 'Tanger', 'Tangier',
                'Agadir', 'Meknès', 'Meknes', 'Oujda', 'Kenitra', 'Tétouan', 'Tetouan',
                'Safi', 'Mohammedia', 'Khouribga', 'Beni Mellal', 'El Jadida', 'Nador',
                'Settat', 'Larache', 'Khemisset', 'Guelmim', 'Berrechid', 'Errachidia',
                'Ksar El Kebir', 'Sale', 'Salé', 'Taza', 'Essaouira', 'Ouarzazate',
                'Temara', 'Skhirate', 'Deroua', 'Mohammadia', 'El Menzel', 'Sidi Slimane',
                'Inezgane', 'Ait Melloul', 'Taroudant', 'Tiznit', 'Laayoune', 'Dakhla',
                'Fnideq', 'Martil', 'Mdiq', 'Chefchaouen', 'Al Hoceima', 'Berkane',
                'Taourirt', 'Figuig', 'Bouarfa', 'Midelt', 'Azrou', 'Ifrane', 'Sefrou',
                'Tiflet', 'Sidi Kacem', 'Sidi Yahya', 'Ouazzane', 'Asilah', 'Ksar Sghir',
                'Tan-Tan', 'Smara', 'Boujdour', 'Assa', 'Zagora', 'Tinghir', 'Rissani'
            ];

            // Pattern 1: Chercher "SALE", "RABAT", etc. en MAJUSCULES sur une ligne seule (format DIGYLOG)
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                // Ligne en majuscules qui correspond à une ville
                if (line.length > 2 && line.length < 25 && line === line.toUpperCase()) {
                    for (let city of moroccanCities) {
                        if (line.toUpperCase() === city.toUpperCase() || 
                            line.toUpperCase().includes(city.toUpperCase())) {
                            info.destination_city = line;
                            break;
                        }
                    }
                    if (info.destination_city) break;
                }
            }

            // Pattern 2: Si pas trouvé, chercher après "Hub" ou "Destinataire"
            if (!info.destination_city) {
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim().toLowerCase();
                    if (line.includes('hub') || line.includes('destinataire')) {
                        // Chercher la ville sur cette ligne ou les lignes suivantes
                        for (let j = i; j < Math.min(i + 3, lines.length); j++) {
                            const checkLine = lines[j].trim();
                            for (let city of moroccanCities) {
                                if (checkLine.toLowerCase().includes(city.toLowerCase())) {
                                    // Éviter "NET CASA" ou similaire, prendre la vraie ville
                                    if (!checkLine.toLowerCase().includes('net ')) {
                                        info.destination_city = city;
                                        break;
                                    }
                                }
                            }
                            if (info.destination_city) break;
                        }
                    }
                    if (info.destination_city) break;
                }
            }

            // Pattern 3: Fallback - chercher ville mais EXCLURE Casablanca si c'est dans l'en-tête
            if (!info.destination_city) {
                let foundCities = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    for (let city of moroccanCities) {
                        if (line.toLowerCase().includes(city.toLowerCase())) {
                            // Ignorer si c'est dans "NET CASA" ou similaire
                            if (!line.toLowerCase().includes('net ')) {
                                foundCities.push({ city: city, index: i, line: line });
                            }
                        }
                    }
                }
                // Prendre la dernière ville trouvée (plus probable d'être la destination)
                if (foundCities.length > 0) {
                    info.destination_city = foundCities[foundCities.length - 1].city;
                }
            }

            // Extraire receiver_name
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                const receiverMatch = line.match(/(?:Destinataire|Client)\s*:\s*(.+)/i);
                if (receiverMatch) {
                    info.receiver_name = receiverMatch[1].trim().split(/\s+/).slice(0, 2).join(' ');
                    break;
                }
                
                const nameMatch = line.match(/^([A-Z][a-zàâäéèêëïîôùûü]+(?:\s+[A-Z][a-zàâäéèêëïîôùûü]+){1,2})$/);
                if (nameMatch && line.length > 3 && line.length < 40) {
                    if (!moroccanCities.some(city => line.toLowerCase().includes(city.toLowerCase()))) {
                        info.receiver_name = nameMatch[1];
                    }
                }
            }

            return info;
        }

        // Extraire UNIQUEMENT les vrais codes de tracking
        // Extraire UNIQUEMENT les codes sous le code-barres
        function extractTrackingCodes(text) {
            console.log('🔍 === RECHERCHE CODES SOUS CODE-BARRES ===');
            
            const codes = new Set();
            const lines = text.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Pattern 1: XXX-12345 - CODE (exemple: ORH2503 - S5FE48B7A)
                // Ce pattern capture le code qui vient APRÈS le tiret
                const match1 = line.match(/\b\d{3,}\s*-\s*\d+\s+-\s*([A-Za-z][A-Za-z0-9]{7,10})\b/i);
                if (match1) {
                    const code = match1[1].toUpperCase();
                    codes.add(code);
                    console.log(`  ✅ Pattern code-barres: ${code}`);
                    continue;
                }
                
                // Pattern 2: XXXX - code (format générique avec tiret)
                // Exemple: "79EE09 - s2d3a84fe" ou "91ABCD - s5856a88s"
                const match2 = line.match(/([a-zA-Z0-9]+)\s*-\s*([A-Za-z][A-Za-z0-9]{7,10})$/i);
                if (match2 && match2[1].length >= 4) {
                    const code = match2[2].toUpperCase();
                    codes.add(code);
                    console.log(`  ✅ Fin de ligne: ${code}`);
                    continue;
                }
                
                // Pattern 3: STORENAME-xxxxx - code (format DIGYLOG avec nom de store)
                // Exemple: "CARENA-28014 - se7e9ab7f"
                const match3 = line.match(/\b[A-Za-z]+-\d+\s*-\s*([A-Za-z][A-Za-z0-9]{7,10})\b/i);
                if (match3) {
                    const code = match3[1].toUpperCase();
                    codes.add(code);
                    console.log(`  ✅ Pattern STORE-NUM: ${code}`);
                    continue;
                }
                
                // Pattern 4: ORHxxxxx - code ou BCxxxxx - code ou LEXxxxxx - code
                const match4 = line.match(/\b(?:ORH|BC|LEX)[A-Z0-9]+\s*-\s*([A-Za-z][A-Za-z0-9]{7,10})\b/i);
                if (match4) {
                    const code = match4[1].toUpperCase();
                    codes.add(code);
                    console.log(`  ✅ Pattern ORH/BC/LEX: ${code}`);
                    continue;
                }
            }
            
            const codesArray = [...codes];
            console.log(`\n✅ ${codesArray.length} codes SOUS CODE-BARRES détectés`);
            
            if (codesArray.length === 0) {
                console.log('❌ Aucun code trouvé !');
                console.log('📝 Aperçu (500 premiers caractères):');
                console.log(text.substring(0, 500));
            }
            
            return codesArray;
        }

        // Extraire les informations complètes des tickets avec expéditeur global
        function extractOrdersWithDetails(text, fileName = '') {
            console.log('\n🔍 === EXTRACTION COMMANDES ===');
            const orders = [];
            
            // Détecter TOUS les codes avec le nouveau pattern
            const allCodes = extractTrackingCodes(text);
            console.log(`📊 ${allCodes.length} codes UNIQUES détectés (doublons déjà éliminés)`);
            
            if (allCodes.length === 0) {
                console.error('❌ Aucun code détecté!');
                return orders;
            }
            
            // Pour chaque code UNIQUE, extraire les infos et l'expéditeur
            allCodes.forEach((code, index) => {
                const codeIndex = text.toLowerCase().indexOf(code.toLowerCase());
                if (codeIndex === -1) return;
                
                // Prendre 600 caractères autour du code pour analyser
                const start = Math.max(0, codeIndex - 400);
                const end = Math.min(text.length, codeIndex + 200);
                const section = text.substring(start, end);
                
                // Détecter l'expéditeur dans cette section
                const expeditor = detectExpeditorFromSection(section);
                const ticketInfo = extractTicketInfo(section);
                
                const finalStoreName = expeditor || ticketInfo.store_name || "Non identifié";
                
                orders.push({
                    tracking: code,
                    barcode: code,
                    store_name: finalStoreName,
                    store_full: ticketInfo.store_full || finalStoreName,
                    quantity: ticketInfo.quantity || "",
                    product_name: ticketInfo.product_name || "",
                    price: ticketInfo.price || "",
                    destination_city: ticketInfo.destination_city || "",
                    receiver_name: ticketInfo.receiver_name || "",
                    order_date: ticketInfo.order_date || "", // 📅 Date de la commande
                    fileName: fileName, // 📁 Ajouter le nom du fichier source
                    scanned: false,
                    id: Date.now() + Math.random()
                });
                
                if (index < 5) {
                    console.log(`  ✅ ${code} → ${finalStoreName}`);
                }
            });

            console.log(`\n✅ TOTAL: ${orders.length} commandes UNIQUES extraites (pas de doublons)\n`);
            return orders;
        }
        
        // Détecter expéditeur dans une section de texte
        function detectExpeditorFromSection(text) {
            const lines = text.split('\n').filter(l => l.trim());
            
            for (let i = 0; i < Math.min(lines.length, 15); i++) {
                const line = lines[i];
                
                // Chercher [12345]-nom
                if (/expéditeur|expediteur/i.test(line) || /\[\d+\]/.test(line)) {
                    const match = line.match(/\[(\d+)\]\s*-\s*([a-zA-Z][a-zA-Z0-9\s]+)/i);
                    if (match) {
                        return match[2].trim().split(/\s{2,}|\[/)[0];
                    }
                    
                    // Ligne suivante
                    if (lines[i + 1]) {
                        const nextMatch = lines[i + 1].match(/\[(\d+)\]\s*-\s*([a-zA-Z][a-zA-Z0-9\s]+)/);
                        if (nextMatch) {
                            return nextMatch[2].trim().split(/\s{2,}|\[/)[0];
                        }
                    }
                }
            }
            return "";
        }

                    storeGroups[storeName] = [];

            const cleanCode = code.trim().toUpperCase();
            console.log('Code nettoyé:', cleanCode);
            console.log('Longueur:', cleanCode.length);
            
            // Pattern LARGE : accepter N'IMPORTE quel code alphanumérique de 8-11 caractères
            const isValidFormat = /^[A-Za-z][A-Za-z0-9]{7,10}$/i.test(cleanCode);
            console.log('Format valide?', isValidFormat);
            
            if (!cleanCode || !isValidFormat) {
                console.log(`❌ REJETÉ - Code invalide: "${cleanCode}"`);
                return;
            }

            console.log('✅ Format OK, vérification dans la liste...');
            console.log('Total commandes importées:', state.referenceOrders.length);

            // CRITIQUE: Ne JAMAIS faire render() pendant que la caméra est active
            const isCameraMode = state.scanMode === 'camera' && state.isCameraActive;

            // Vérifier si déjà scanné
            const isAlreadyScanned = state.scannedOrders.has(cleanCode);
            console.log('Déjà scanné?', isAlreadyScanned);
            
            if (isAlreadyScanned) {
                const orderInfo = state.ordersMap[cleanCode];
                const expediteur = orderInfo ? (orderInfo.store_name || 'Inconnu') : 'Inconnu';
                console.log('⚠️ Code déjà scanné:', cleanCode, 'Expéditeur:', expediteur);
                showNotification(`⚠️ Déjà scanné | ${expediteur}`, 'warning');
                state.lastScanned = cleanCode;
                playSound('duplicate');
                
                if (!isCameraMode) {
                    updateCountersOnly();
                } else {
                    updateCountersDirectly();
                }
                return;
            }

            // Vérifier si dans la liste
            const isInList = state.referenceOrders.includes(cleanCode);
            console.log('Dans la liste?', isInList);
            
            if (!isInList) {
                console.log('❌ CODE NON TROUVÉ:', cleanCode);

        // Gérer le scan avec détection automatique de lecteur code-barres
        function initBarcodeScanner() {
            let buffer = '';
            let timeout = null;

            document.addEventListener('keypress', function(e) {
                // Vérifier si on est en mode scan (expéditions ou retours)
                const isExpeditionScan = state.activeTab === 'expedition' && state.currentView === 'scan' && state.scanMode === 'keyboard';
                const isRetourScan = state.activeTab === 'retours' && state.retours.currentView === 'scan';
                
                if (!isExpeditionScan && !isRetourScan) {
                    return;
                }

                const currentTime = new Date().getTime();
                
                // Si le délai entre 2 touches est < 50ms, c'est un scanner (pas un humain)
                if (currentTime - state.lastKeyTime < 50) {
                    // C'est un scanner, accumuler les caractères
                    if (e.key === 'Enter') {
                        // Fin du scan - MINIMUM 7 caractères
                        if (buffer.length >= 7) {
                            console.log('📦 Scanner détecté, code complet:', buffer);
                            
                            // Envoyer au bon handler selon l'onglet actif
                            if (state.activeTab === 'retours') {
                                handleRetourScan(buffer);
                                const input = document.getElementById('retourScanInput');
                                if (input) input.value = buffer;
                            } else {
                                handleScan(buffer);
                                const input = document.getElementById('scanInput');
                                if (input) input.value = buffer;
                            }
                        } else {
                            console.log('⚠️ Code trop court ignoré:', buffer, `(${buffer.length} caractères)`);
                        }
                        buffer = '';
                    } else {
                        buffer += e.key;
                    }
                } else {
                    // Reset si trop lent (frappe humaine)
                    buffer = e.key;
                }
                
                state.lastKeyTime = currentTime;

                // Sécurité : vider le buffer après 200ms
                if (timeout) clearTimeout(timeout);
                timeout = setTimeout(() => {
                    if (buffer.length >= 7) {  // MINIMUM 7 caractères
                        console.log('📦 Code détecté (timeout):', buffer);
                        
                        // Envoyer au bon handler selon l'onglet actif
                        if (state.activeTab === 'retours') {
                            handleRetourScan(buffer);
                            const input = document.getElementById('retourScanInput');
                            if (input) input.value = buffer;
                        } else {
                            handleScan(buffer);
                            const input = document.getElementById('scanInput');
                            if (input) input.value = buffer;
                        }
                    } else if (buffer.length > 0) {
                        console.log('⚠️ Buffer vidé (trop court):', buffer, `(${buffer.length} caractères)`);
                    }
                    buffer = '';
                }, 200);
            });
        }

        // Gérer l'input manuel
        function handleScanInput(value) {
            state.scanInput = value;
            render();
        }

        // Gérer Enter manuel
        function handleScanKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const code = state.scanInput.trim().toUpperCase();
                
                if (code) {
                    console.log('📝 Saisie manuelle:', code);
                    handleScan(code);
                    state.scanInput = '';
                    render();
                    setTimeout(() => {
                        const input = document.getElementById('scanInput');
                        if (input) {
                            input.value = '';
                            input.focus();
                        }
                    }, 100);
                }
            }
        }

        // Démarrer la caméra UNE SEULE FOIS
        async function startCamera() {
            try {
                // IMPORTANT : Vérifier si déjà en cours de démarrage ou active
                if (state.isCameraActive || state.isStartingCamera) {
                    console.log('📹 Caméra déjà active ou en cours de démarrage');
                    return;
                }

                state.isStartingCamera = true;

                const video = document.getElementById('cameraVideo');
                if (!video) {
                    console.log('⏳ Vidéo non prête, nouvelle tentative...');
                    state.isStartingCamera = false;
                    setTimeout(startCamera, 300);
                    return;
                }

                console.log('🎬 Démarrage de la caméra...');

                // Demander l'accès à la caméra
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;
                state.cameraStream = stream;

                // Attendre que la vidéo soit prête
                await new Promise((resolve) => {
                    video.onloadedmetadata = async () => {
                        await video.play();
                        resolve();
                    };
                });

                state.isCameraActive = true;
                state.isStartingCamera = false;

                // Mettre à jour l'affichage pour enlever le message de chargement
                const loadingDiv = document.querySelector('.bg-black.bg-opacity-75');
                if (loadingDiv) {
                    loadingDiv.style.display = 'none';
                }

                console.log('✅ Caméra active');

                // Initialiser ZXing UNE SEULE FOIS
                const codeReader = new ZXing.BrowserMultiFormatReader();
                state.codeReader = codeReader;

                // Variables pour gérer les scans
                let lastCode = '';
                let lastTime = 0;
                let isProcessing = false;

                // Scanner en boucle continue
                codeReader.decodeFromVideoDevice(null, 'cameraVideo', (result, err) => {
                    if (result && !isProcessing) {
                        const code = result.text.trim().toUpperCase();
                        const now = Date.now();
                        
                        // Anti-doublon : 1 seconde entre scans du même code
                        if (code !== lastCode || now - lastTime > 1000) {
                            console.log('📦 Détecté:', code);
                            
                            // Marquer comme en traitement
                            isProcessing = true;
                            
                            // Afficher le code temporairement
                            const display = document.getElementById('detectedCode');
                            if (display) {
                                display.textContent = `Détecté: ${code}`;
                                display.className = 'bg-blue-500 text-white border-2 border-blue-700 rounded-lg p-3 text-center font-bold mb-2 shadow-lg';
                                
                                setTimeout(() => {
                                    if (display) {
                                        display.className = 'hidden';
                                    }
                                }, 2000);
                            }
                            
                            // Traiter le scan - Pattern LARGE pour accepter tous les codes
                            if (/^[A-Za-z][A-Za-z0-9]{7,10}$/i.test(code)) {
                                handleScan(code);
                                lastCode = code;
                                lastTime = now;
                            } else {
                                console.log(`⚠️ Code caméra ignoré (format invalide): ${code}`);
                            }
                            
                            // Libérer après 500ms
                            setTimeout(() => {
                                isProcessing = false;
                            }, 500);
                        }
                    }
                });

            } catch (error) {
                state.isStartingCamera = false;
                console.error('❌ Erreur caméra:', error.name, error.message);
                
                if (error.name === 'NotAllowedError') {
                    showNotification('❌ Accès caméra refusé - Autorisez dans les paramètres', 'error');
                } else if (error.name === 'NotFoundError') {
                    showNotification('❌ Aucune caméra détectée', 'error');
                } else {
                    showNotification('❌ Erreur caméra : ' + error.name, 'error');
                }
                
                // Retour automatique au mode clavier après 2 secondes
                setTimeout(() => {
                    state.scanMode = 'keyboard';
                    render();
                }, 2000);
            }
        }

        // Arrêter la caméra
        function stopCamera() {
            if (state.cameraStream) {
                state.cameraStream.getTracks().forEach(track => track.stop());
                state.cameraStream = null;
            }
            
            if (state.codeReader) {
                try {
                    state.codeReader.reset();
                } catch (e) {
                    // Ignorer les erreurs de reset
                }
                state.codeReader = null;
            }

            const video = document.getElementById('cameraVideo');
            if (video) {
                video.srcObject = null;
            }

            state.isCameraActive = false;
        }

        // Changer le mode de scan SANS casser la caméra
        function changeScanMode(mode) {
            if (state.scanMode === mode) return;
            
            const previousMode = state.scanMode;
            
            // Arrêter la caméra seulement si on quitte le mode caméra
            if (previousMode === 'camera' && mode !== 'camera') {
                stopCamera();
            }
            
            state.scanMode = mode;
            render();

            // Démarrer la caméra seulement si on passe en mode caméra
            if (mode === 'camera' && previousMode !== 'camera') {
                setTimeout(() => {
                    startCamera();
                }, 400);
            }
        }

        // Exporter CSV avec codes inconnus
        function exportCSV() {
            const headers = ['Code Suivi', 'Statut', 'Type'];
            const rows = [];
            
            // Ajouter les commandes
            state.referenceOrders.forEach(code => {
                rows.push([
                    code,
                    state.scannedOrders.has(code) ? 'Scanné' : 'À scanner',
                    'Commande valide'
                ]);
            });
            
            // Ajouter les codes inconnus
            state.unknownCodes.forEach(item => {
                rows.push([
                    item.code,
                    'Non trouvé',
                    'Code inconnu - ' + item.date + ' ' + item.time
                ]);
            });
            
            const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `commandes_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function clearUnknownCodes() {

        // ============= FONCTIONS DE SCAN GROUPÉ ET SÉLECTION =============
        
        // Toggle mode sélection

                state.selectedCodes = new Set();

        // Toggle sélection d'un code
        function toggleCodeSelection(code) {
            if (!state.selectedCodes) state.selectedCodes = new Set();
            
            if (state.selectedCodes.has(code)) {
                state.selectedCodes.delete(code);
            } else {
                state.selectedCodes.add(code);
            }
            render();
        }

        // Sélectionner tous les codes restants
        function selectAllCodes() {
            const remainingOrders = state.referenceOrders.filter(code => !state.scannedOrders.has(code));
            state.selectedCodes = new Set(remainingOrders);
            render();
        }

        // Désélectionner tous les codes
        function deselectAllCodes() {
            state.selectedCodes = new Set();
            render();

        // Scanner un seul code manuellement
        function scanSingleCode(code) {
            if (state.scannedOrders.has(code)) {
                showNotification('⚠️ Déjà scanné: ' + code, 'warning');
                return;
            }
            
            state.scannedOrders.add(code);
            state.lastScanned = code;
            
            const orderInfo = state.ordersMap[code];
            const expediteur = orderInfo ? (orderInfo.store_name || 'Inconnu') : 'Inconnu';
            
            playSound('success');
            showNotification(`✅ Scanné | ${expediteur}`, 'success');
            saveToLocalStorage();
            render();
        }

        // Scanner tous les codes sélectionnés
        function scanSelectedCodes() {
            if (!state.selectedCodes || state.selectedCodes.size === 0) {
                showNotification('⚠️ Aucun code sélectionné', 'warning');
                return;
            }
            
            const count = state.selectedCodes.size;
            
            state.selectedCodes.forEach(code => {
                if (!state.scannedOrders.has(code)) {
                    state.scannedOrders.add(code);
                }
            });
            
            state.selectedCodes = new Set();
            state.selectMode = false;
            
            playSound('success');
            showNotification(`✅ ${count} commandes scannées!`, 'success');
            saveToLocalStorage();
            render();
        }

        // Scanner toutes les commandes restantes
        function scanAllRemainingCodes() {
            const remainingOrders = state.referenceOrders.filter(code => !state.scannedOrders.has(code));
            
            if (remainingOrders.length === 0) {
                showNotification('✅ Toutes les commandes sont déjà scannées!', 'success');
                return;
            }
            
            if (!confirm(`Scanner les ${remainingOrders.length} commandes restantes ?`)) {
                return;
            }
            
            remainingOrders.forEach(code => {
                state.scannedOrders.add(code);
            });
            
            state.lastScanned = remainingOrders[remainingOrders.length - 1];
            
            playSound('success');
            showNotification(`✅ ${remainingOrders.length} commandes scannées!`, 'success');
            saveToLocalStorage();
            render();
        }

        // ============= BON DE RAMASSAGE =============
        
        // Afficher le modal de sélection des expéditeurs pour le bon de ramassage
        function showBonRamassageModal() {

        // Générer le bon de ramassage pour un expéditeur
        function generateBonRamassage(storeName) {
            const orders = state.storeGroups[storeName];
            if (!orders || orders.length === 0) {
                showNotification('❌ Aucune commande pour cet expéditeur', 'error');
                return;

            // Fermer le modal de sélection
            const modal = document.getElementById('bonRamassageModal');
            if (modal) modal.remove();

            // Calculer les stats
            const scannedOrders = orders.filter(o => state.scannedOrders.has(o.tracking));
            const totalSortie = scannedOrders.length;
            
            // Générer le numéro de BL
            const blNumber = 'BL' + Date.now().toString().slice(-6);
            
            // 📅 Utiliser la date des commandes de cet expéditeur (première date trouvée)
            let orderDate = '';
            for (const order of orders) {
                if (order.order_date) {
                    orderDate = order.order_date;
                    break;
                }

            // Si pas de date trouvée, utiliser la date du jour
            const displayDate = orderDate || new Date().toLocaleDateString('fr-FR');

            // Créer les lignes du tableau
            let tableRows = '';
            orders.forEach(order => {
                const isScanned = state.scannedOrders.has(order.tracking);
                const status = isScanned ? 'Sortie' : 'Non sortie';

            });

            // ⚠️ NE PAS TRADUIRE le nom de l'expéditeur - utiliser tel quel
            const storeNameDisplay = storeName;

            const htmlContent = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bon de Ramassage - ${storeNameDisplay}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

        // Générer tous les bons de ramassage
        function generateAllBonsRamassage() {
            const stores = Object.keys(state.storeGroups);
            if (stores.length === 0) {
                showNotification('❌ Aucun expéditeur trouvé', 'error');
                return;
            }

            // Fermer le modal de sélection
            const modal = document.getElementById('bonRamassageModal');
            if (modal) modal.remove();

            // Générer un bon pour chaque expéditeur avec un léger délai
            stores.forEach((store, index) => {
                setTimeout(() => {
                    generateBonRamassage(store);
                }, index * 500);
            });

            showNotification(`📦 Génération de ${stores.length} bons en cours...`, 'success');
        }

        // ============= GESTION DES RETOURS =============
        
        // Changer d'onglet principal
        function switchTab(tab) {
            if (state.activeTab !== tab) {
                // Arrêter la caméra si active
                if (state.isCameraActive) {
                    stopCamera();
                }
            }
            state.activeTab = tab;
            render();

        // Extraire les commandes retour depuis le PDF BR
        function extractRetourOrders(text) {
            console.log('🔄 === EXTRACTION RETOURS ===');
            console.log('📄 Texte reçu:', text.length, 'caractères');
            
            const orders = [];
            const seenTrackings = new Set();
            
            // Liste des stores connus
            const knownStores = ['afrizone', 'idealshop', 'alodia', 'hello'];
            
            // Liste de mots à exclure (villes, noms communs)
            const excludeWords = [
                'SLIMANE', 'SIDI', 'SETTAT', 'SAFI', 'SALE', 'SMARA', 'SMIMOU',
                'SIGNATURE', 'STORE', 'SELLER', 'SUIVANT', 'SUIVRE', 'SOUSSE',
                'SKHIRATE', 'SEBT', 'SEFROU', 'SEBTA', 'SOUK', 'SKHOUR'
            ];
            
            // Fonction pour valider un tracking DIGYLOG
            // Les vrais trackings ont: S + mélange de chiffres ET lettres (pas juste lettres)
            function isValidTracking(code) {
                if (!code) return false;
                
                const upperCode = code.toUpperCase();
                
                // Exclure les mots connus
                for (const word of excludeWords) {
                    if (upperCode === word || upperCode.startsWith(word + ' ')) {
                        console.log(`❌ Exclu (mot connu): ${upperCode}`);
                        return false;
                    }
                }
                
                // Vérifier le format: doit commencer par S ou RE-S
                if (!upperCode.match(/^(RE-)?S[A-Z0-9]/)) return false;
                
                // Extraire la partie après S ou RE-S
                const afterS = upperCode.replace(/^(RE-)?S/, '');
                
                // Doit contenir AU MOINS un chiffre (pas juste des lettres comme SLIMANE)
                const hasDigit = /\d/.test(afterS);
                
                // Si que des lettres et ressemble à un mot, rejeter
                if (!hasDigit && /^[A-Z]+$/.test(afterS)) {
                    console.log(`❌ Exclu (que des lettres): ${upperCode}`);
                    return false;
                }
                
                // Longueur entre 6 et 10 caractères après le S (plus permissif)
                if (afterS.length < 6 || afterS.length > 10) {
                    return false;
                }
                
                return true;
            }
            
            // MÉTHODE 1: Chercher tous les trackings potentiels dans le texte brut
            const potentialTrackings = text.match(/\b(?:RE-)?S[A-Z0-9]{6,10}\b/gi) || [];
            const validTrackings = potentialTrackings.filter(t => isValidTracking(t));
            console.log(`🔍 Trackings potentiels: ${potentialTrackings.length}, valides: ${validTrackings.length}`);
            
            // MÉTHODE 2: Analyser ligne par ligne
            const lines = text.split(/[\n\r]+/).map(l => l.trim()).filter(l => l.length > 0);
            console.log(`📄 ${lines.length} lignes à analyser`);
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Ignorer les lignes d'en-tête et de pied
                if (/^Order\s+Trak/i.test(line)) continue;
                if (/^TOTAL\s*\d*/i.test(line)) continue;
                if (/^Signature/i.test(line)) continue;
                if (/^N°\s*CIN/i.test(line)) continue;
                if (/^BRS\s*N°/i.test(line)) continue;
                if (/^Date\s*:/i.test(line)) continue;
                if (/^Nombre\s+commandes/i.test(line)) continue;
                if (/^Phone\s*:/i.test(line)) continue;
                if (/^HAY\s+MOULAY/i.test(line)) continue;
                if (/^MACHAOUI/i.test(line)) continue;
                if (/DIGYLOG/i.test(line)) continue;
                if (/^BR-\d+\s+@/i.test(line)) continue;
                if (/^@\s*\d+$/i.test(line)) continue;
                
                // Chercher les trackings dans cette ligne
                const trackingMatches = line.match(/\b(?:RE-)?S[A-Z0-9]{6,10}\b/gi) || [];
                
                for (const trackingRaw of trackingMatches) {
                    const tracking = trackingRaw.toUpperCase();
                    
                    // Valider le tracking
                    if (!isValidTracking(tracking)) {
                        console.log(`❌ Rejeté: ${tracking} (pas un vrai tracking)`);
                        continue;
                    }
                    
                    // Skip si déjà vu
                    if (seenTrackings.has(tracking)) continue;
                    seenTrackings.add(tracking);
                    
                    // Trouver la position du tracking dans la ligne
                    const trackingIndex = line.toUpperCase().indexOf(tracking);
                    const beforeTracking = line.substring(0, trackingIndex).trim();
                    const afterTracking = line.substring(trackingIndex + tracking.length).trim();
                    
                    // Order ID = premier mot avant le tracking
                    let orderId = 'N/A';
                    const orderParts = beforeTracking.split(/\s+/);
                    if (orderParts.length > 0 && orderParts[0].length > 0) {
                        orderId = orderParts[0];
                    }
                    
                    // Après le tracking: Ville + Store
                    let ville = '';
                    let store = '';
                    
                    // Chercher le store connu dans afterTracking
                    const afterLower = afterTracking.toLowerCase();
                    for (const knownStore of knownStores) {
                        if (afterLower.includes(knownStore)) {
                            store = knownStore;
                            const storeIndex = afterLower.indexOf(knownStore);
                            ville = afterTracking.substring(0, storeIndex).trim();
                            break;
                        }
                    }
                    
                    // Si pas de store trouvé dans afterTracking, chercher dans toute la ligne
                    if (!store) {
                        const lineLower = line.toLowerCase();
                        for (const knownStore of knownStores) {
                            if (lineLower.includes(knownStore)) {
                                store = knownStore;
                                break;
                            }
                        }
                    }
                    
                    // Si toujours pas de store, prendre le dernier mot
                    if (!store) {
                        const afterParts = afterTracking.split(/\s+/).filter(p => p.length > 0);
                        if (afterParts.length >= 1) {
                            store = afterParts[afterParts.length - 1];
                            if (afterParts.length >= 2) {
                                ville = afterParts.slice(0, -1).join(' ');
                            }
                        }
                    }
                    
                    // Nettoyer le store
                    store = store.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    
                    // Capitaliser le store
                    if (store) {
                        store = store.charAt(0).toUpperCase() + store.slice(1);
                    } else {
                        store = 'Non identifié';
                    }
                    
                    orders.push({
                        order: orderId,
                        tracking: tracking,
                        ville: ville.trim(),
                        store: store,
                        scanned: false,
                        id: Date.now() + Math.random()
                    });
                }
            }
            
            // MÉTHODE 3: Si peu de résultats, chercher directement tous les trackings valides
            if (orders.length < validTrackings.length / 2) {
                console.log('⚠️ Méthode ligne par ligne insuffisante, utilisation méthode brute');
                
                // Chercher le store dominant dans le texte
                let dominantStore = 'Non identifié';
                for (const knownStore of knownStores) {
                    const regex = new RegExp(knownStore, 'gi');
                    const matches = text.match(regex);
                    if (matches && matches.length > 5) {
                        dominantStore = knownStore.charAt(0).toUpperCase() + knownStore.slice(1);
                        break;
                    }
                }
                
                // Ajouter tous les trackings valides non encore trouvés
                for (const trackingRaw of validTrackings) {
                    const tracking = trackingRaw.toUpperCase();
                    if (!seenTrackings.has(tracking)) {
                        seenTrackings.add(tracking);
                        orders.push({
                            order: 'N/A',
                            tracking: tracking,
                            ville: '',
                            store: dominantStore,
                            scanned: false,
                            id: Date.now() + Math.random()
                        });
                    }
                }
            }
            
            // Log des stats par store
            const storeStats = {};
            orders.forEach(o => {
                const s = o.store || 'Non identifié';
                storeStats[s] = (storeStats[s] || 0) + 1;
            });
            console.log('📊 Stats par store:', storeStats);
            console.log(`✅ ${orders.length} commandes retour extraites (uniques)`);
            
            return orders;
        }

        // Importer fichier PDF retour
        async function handleRetourFiles(files) {
            if (!files || files.length === 0) return;
            
            state.isProcessing = true;
            render();
            
            let allOrders = [...state.retours.orders];
            const existingTrackings = new Set(allOrders.map(o => o.tracking));
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    if (file.type === 'application/pdf') {
                        const arrayBuffer = await file.arrayBuffer();
                        const text = await extractTextFromPDF(arrayBuffer);
                        const orders = extractRetourOrders(text);
                        
                        // Ajouter seulement les nouveaux
                        for (const order of orders) {
                            if (!existingTrackings.has(order.tracking)) {
                                existingTrackings.add(order.tracking);
                                allOrders.push(order);
                            }
                        }
                        
                        state.retours.uploadedFiles.push({
                            name: file.name,
                            count: orders.length
                        });
                    }
                } catch (error) {
                    console.error(`Erreur avec ${file.name}:`, error);
                    showNotification(`❌ Erreur: ${file.name}`, 'error');
                }
            }
            
            // Grouper par store
            const storeGroups = {};
            allOrders.forEach(order => {
                const store = order.store || 'Non identifié';
                if (!storeGroups[store]) {
                    storeGroups[store] = [];
                }
                storeGroups[store].push(order);
            });
            
            state.retours.orders = allOrders;
            state.retours.storeGroups = storeGroups;
            state.isProcessing = false;
            
            saveRetoursToLocalStorage();
            showNotification(`✅ ${allOrders.length} commandes retour importées`, 'success');
            render();
        }

        // Scanner un retour
        function handleRetourScan(code) {
            if (!code) return;
            
            let cleanCode = code.trim().toUpperCase();
            
            console.log('🔍 Scan retour:', cleanCode);
            
            // Vérifier format - accepter S... et RE-S...
            // Format: S + 6-10 caractères OU RE-S + 6-10 caractères
            if (!/^(RE-)?S[A-Z0-9]{6,10}$/i.test(cleanCode)) {
                console.log('❌ Format invalide:', cleanCode);
                showNotification('❌ Format invalide', 'error');
                playSound('error');
                return;
            }
            
            // Déjà scanné ?
            if (state.retours.scannedOrders.has(cleanCode)) {
                showNotification('⚠️ Déjà scanné', 'warning');
                playSound('duplicate');
                return;
            }
            
            // Dans la liste ?
            const order = state.retours.orders.find(o => o.tracking === cleanCode);
            if (!order) {
                // Code inconnu
                if (!state.retours.unknownCodes.find(u => u.code === cleanCode)) {
                    state.retours.unknownCodes.push({
                        code: cleanCode,
                        time: new Date().toLocaleTimeString('fr-FR'),
                        date: new Date().toLocaleDateString('fr-FR')
                    });
                }
                showNotification('❌ Code non trouvé dans la liste', 'error');
                playSound('error');
                saveRetoursToLocalStorage();
                render();
                return;
            }
            
            // Succès !
            state.retours.scannedOrders.add(cleanCode);
            state.retours.lastScanned = cleanCode;
            
            // Calculer combien il reste pour ce store
            const storeOrders = state.retours.storeGroups[order.store] || [];
            const storeRemaining = storeOrders.filter(o => !state.retours.scannedOrders.has(o.tracking)).length;
            
            showNotification(`✅ ${order.store} | Reste: ${storeRemaining}`, 'success');
            playSound('success');
            saveRetoursToLocalStorage();
            render();
            
            // Refocus sur l'input
            setTimeout(() => {
                const input = document.getElementById('retourScanInput');
                if (input) {
                    input.value = '';
                    input.focus();
                }
            }, 100);
        }

        // Sauvegarder retours dans localStorage
        function saveRetoursToLocalStorage() {
            try {
                const data = {
                    orders: state.retours.orders,
                    scannedOrders: [...state.retours.scannedOrders],
                    storeGroups: state.retours.storeGroups,
                    uploadedFiles: state.retours.uploadedFiles,
                    unknownCodes: state.retours.unknownCodes
                };
                localStorage.setItem('digylog_retours_data', JSON.stringify(data));
            } catch (error) {
                console.error('Erreur sauvegarde retours:', error);
            }
        }

        // Charger retours depuis localStorage
        function loadRetoursFromLocalStorage() {
            try {
                const data = JSON.parse(localStorage.getItem('digylog_retours_data'));
                if (data) {
                    state.retours.orders = data.orders || [];
                    state.retours.scannedOrders = new Set(data.scannedOrders || []);
                    state.retours.storeGroups = data.storeGroups || {};
                    state.retours.uploadedFiles = data.uploadedFiles || [];
                    state.retours.unknownCodes = data.unknownCodes || [];
                    return true;
                }
            } catch (error) {
                console.error('Erreur chargement retours:', error);
            }
            return false;
        }

                    uploadedFiles: [],

                    scanMode: 'keyboard',
                    lastScanned: '',
                    unknownCodes: []
                };
                localStorage.removeItem('digylog_retours_data');
                showNotification('✅ Retours réinitialisés', 'success');
                render();
            }
        }
